body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);

 background:var(--panel);border:1px solid var(--rule);border-radius:4px;margin-bottom:16px}

 background:var(--s1);color:#fff;border:none;border-radius:4px}

.err{color:var(--crit);font-size:14px;min-height:20px;margin-top:12px}
